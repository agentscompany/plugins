name: catalog
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/build-catalog.py"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugins
        run: python3 scripts/build-catalog.py
      - name: Commit catalog.json
        if: github.event_name == 'push'
        run: |
          git diff --quiet catalog.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json && git commit -m "chore: rebuild catalog.json" && git push
